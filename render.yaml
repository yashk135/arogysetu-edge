# render.yaml — 1-Click Production Deployment for ArogyaSetu WhatsApp Bot Server
services:
  - type: web
    name: arogyasetu-whatsapp-bot
    env: node
    buildCommand: npm install
    startCommand: npm run bot
    envVars:
      - key: PORT
        value: 5000
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
